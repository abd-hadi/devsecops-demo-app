name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t devsecops-demo-app:${GITHUB_REF_NAME} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo-app:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${GITHUB_REF_NAME}
          docker tag devsecops-demo-app:${GITHUB_REF_NAME} "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: abd-hadi/devsecops-demo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag
        run: |
          sed -i "s/^  tag: .*/  tag: ${GITHUB_REF_NAME}/" gitops/devsecops-demo-app/values.yaml

      - name: Commit GitOps change
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add devsecops-demo-app/values.yaml
          git commit -m "Deploy ${GITHUB_REF_NAME}"
          git push
